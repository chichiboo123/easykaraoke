name: CI

# 배포 워크플로(deploy-pages.yml)는 pages:write 권한과 github-pages 환경이 필요해
# PR에서 돌릴 수 없다. 그래서 검사 전용 워크플로를 따로 둔다.
# PR을 열면 여기서 타입 검사·테스트·빌드·산출물 검사가 모두 돈다.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입 검사 · 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify deployment artifact
        run: npm run check:deploy

      # 이 저장소는 컴파일된 app.js / lib/ / styles.css / fonts/ 를 루트에도 커밋한다
      # (GitHub Pages의 "Deploy from a branch /(root)" 설정을 지원하기 위해).
      # src/ 만 고치고 빌드를 커밋하지 않으면 배포본이 소스와 어긋나므로 여기서 잡는다.
      - name: Check committed build artifacts are up to date
        run: |
          if ! git diff --quiet -- app.js types.js lib styles.css fonts; then
            echo "::error::커밋된 빌드 산출물이 src/ 와 다릅니다. 로컬에서 'npm run build' 후 변경된 파일을 함께 커밋해 주세요."
            echo "--- 어긋난 파일 ---"
            git --no-pager diff --stat -- app.js types.js lib styles.css fonts
            exit 1
          fi
          echo "빌드 산출물이 소스와 일치합니다."
